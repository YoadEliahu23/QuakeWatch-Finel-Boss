apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "quakewatch-helm.fullname" . }}
spec:
  ingressClassName: traefik  
  rules:
    - http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name:  {{ include "quakewatch-helm.fullname" . }}
              port:
                number: {{ .Values.service.port }}
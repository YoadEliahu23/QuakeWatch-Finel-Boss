apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: quakewatch-argo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YoadEliahu23/QuakeWatch-Finel-Boss.git
    targetRevision: main
    path: quakewatch-helm
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
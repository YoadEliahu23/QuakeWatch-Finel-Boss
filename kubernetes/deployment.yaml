apiVersion: apps/v1
kind: Deployment
metadata:
  name: quakewatch
  labels:
    app: quakewatch
spec:
  replicas: 3  
  selector:
    matchLabels:
      app: quakewatch
  template:
    metadata:
      labels:
        app: quakewatch
    spec:
      containers:
        - name: quake-watch
          image: yoadeliahu23/quakewatch:latest
          ports:
            - containerPort: 5000
          resources:
            limits:
              memory: "128Mi"  
              cpu: "500m"  
            requests:
              memory: "64Mi"  
              cpu: "250m" 
          envFrom:
            - configMapRef:
                name: quakewatch-config
            - secretRef:
                name: quakewatch-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 60
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ping
              port: 5000
            periodSeconds: 5
            failureThreshold: 2
          